 dynasty_style_sultanzade_desc: "A son born to an Ottoman princess bears the maternal dynastic style Sultanzade."
 dynasty_style_hanimsultan_desc: "A daughter born to an Ottoman princess bears the female dynastic style Hanımsultan; historically attested personal styles may vary."
 ottoman_franco_alliance_modifier: "Franco-Ottoman Understanding"
 ottoman_franco_alliance_modifier_desc: "Diplomatic ties with France constrain the Habsburgs."
 ottoman_persian_campaign_modifier: "Persian Campaign"
 ottoman_persian_campaign_modifier_desc: "The court has mobilised resources for the eastern frontier."
 ottoman_amasya_peace_modifier: "Peace of Amasya"
 ottoman_amasya_peace_modifier_desc: "The eastern frontier is temporarily settled by treaty."
 ottoman_hurrem_memory_modifier: "Memory of Hürrem Sultan"
 ottoman_hurrem_memory_modifier_desc: "The Sultan honours the political and charitable legacy of Hürrem Sultan."
 ottoman_suleiman.0300.t: "The French Connection"
 ottoman_suleiman.0300.desc: "Francis I is dead. His heir Henry II may preserve the understanding between the Porte and France—or turn toward the Habsburgs."
 ottoman_suleiman.0300.a: "Send gifts and renew the understanding."
 ottoman_suleiman.0300.b: "Our own strength is sufficient."
 ottoman_suleiman.0400.t: "The Eastern Campaign"
 ottoman_suleiman.0400.desc: "The Safavid frontier calls again. The army asks whether the Sultan will lead a costly new expedition into Persia."
 ottoman_suleiman.0400.a: "Mobilise for the Persian campaign."
 ottoman_suleiman.0400.b: "Keep the army at home."
 ottoman_suleiman.0500.t: "Peace at Amasya"
 ottoman_suleiman.0500.desc: "Envoys offer a settlement to end the long Ottoman–Safavid conflict. Peace promises time to govern, though some commanders demand another campaign."
 ottoman_suleiman.0500.a: "Confirm the Peace of Amasya."
 ottoman_suleiman.0500.b: "Reject the settlement."
 ottoman_suleiman.0600.t: "Hürrem Sultan's Passing"
 ottoman_suleiman.0600.desc: "Hürrem Sultan has died. Her influence over the dynasty and the court leaves a void that cannot easily be filled."
 ottoman_suleiman.0600.a: "Honour her foundations and memory."
 ottoman_suleiman.0600.b: "The affairs of state must continue."
