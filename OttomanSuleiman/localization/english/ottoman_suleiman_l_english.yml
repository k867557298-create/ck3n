 bookmark_suleiman_1546: "Suleiman the Magnificent"
 bookmark_suleiman_1546_desc: "1546. The Ottoman Empire stands at the height of Suleiman I's reign. Rule from Constantinople, secure the frontiers, and decide what legacy the Lawgiver will leave."
 restore_suleimans_empire_decision: "Restore Suleiman's Ottoman Empire"
 restore_suleimans_empire_decision_desc: "Unite Anatolia and Thrace beneath a new Ottoman imperial throne."
 restore_suleimans_empire_decision_tooltip: "You establish the Ottoman Empire and gain prestige."
 ottoman_suleiman_legacy_modifier: "Suleiman's Imperial Legacy"
 ottoman_suleiman_legacy_modifier_desc: "The ruler draws authority from the institutions and reputation of Suleiman I."
 ottoman_suleiman.0001.t: "The Age of the Lawgiver"
 ottoman_suleiman.0001.desc: "Suleiman I rules from Constantinople over an empire spanning three continents. Its armies, laws, and court now await your command."
 ottoman_suleiman.0001.a: "The empire shall endure."
