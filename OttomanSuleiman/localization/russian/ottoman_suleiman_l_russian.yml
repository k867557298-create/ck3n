 dynasty_style_sultanzade_desc: "Сын османской принцессы носит материнский династический стиль султанзаде."
 dynasty_style_hanimsultan_desc: "Дочь османской принцессы носит женский династический стиль ханымсултан; исторические личные стили могли различаться."
 ottoman_franco_alliance_modifier: "Франко-османское согласие"
 ottoman_franco_alliance_modifier_desc: "Дипломатические связи с Францией сдерживают Габсбургов."
 ottoman_persian_campaign_modifier: "Персидский поход"
 ottoman_persian_campaign_modifier_desc: "Двор мобилизовал ресурсы для восточной границы."
 ottoman_amasya_peace_modifier: "Амасийский мир"
 ottoman_amasya_peace_modifier_desc: "Восточная граница временно урегулирована договором."
 ottoman_hurrem_memory_modifier: "Память о Хюррем-султан"
 ottoman_hurrem_memory_modifier_desc: "Султан чтит политическое и благотворительное наследие Хюррем-султан."
 ottoman_suleiman.0300.t: "Французская связь"
 ottoman_suleiman.0300.desc: "Франциск I умер. Его наследник Генрих II может сохранить согласие между Портой и Францией или обратиться к Габсбургам."
 ottoman_suleiman.0300.a: "Послать дары и возобновить союз."
 ottoman_suleiman.0300.b: "Нам достаточно собственной силы."
 ottoman_suleiman.0400.t: "Восточный поход"
 ottoman_suleiman.0400.desc: "Сефевидская граница снова зовёт. Войско спрашивает, поведёт ли султан новый дорогостоящий поход в Персию."
 ottoman_suleiman.0400.a: "Мобилизоваться для персидского похода."
 ottoman_suleiman.0400.b: "Оставить войско дома."
 ottoman_suleiman.0500.t: "Мир в Амасье"
 ottoman_suleiman.0500.desc: "Послы предлагают соглашение для завершения долгой османо-сефевидской войны. Мир даст время на управление, хотя военачальники требуют нового похода."
 ottoman_suleiman.0500.a: "Подтвердить Амасийский мир."
 ottoman_suleiman.0500.b: "Отвергнуть соглашение."
 ottoman_suleiman.0600.t: "Смерть Хюррем-султан"
 ottoman_suleiman.0600.desc: "Хюррем-султан умерла. Её влияние на династию и двор оставляет пустоту, которую трудно заполнить."
 ottoman_suleiman.0600.a: "Почтить её вакфы и память."
 ottoman_suleiman.0600.b: "Государственные дела должны продолжаться."
