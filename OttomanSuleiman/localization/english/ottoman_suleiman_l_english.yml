 bookmark_suleiman_1546_desc: "1546. The Ottoman Empire stands at the height of Suleiman I's reign. Rule from Constantinople, secure the frontiers, and decide what legacy the Lawgiver will leave."
 restore_suleimans_empire_decision: "Restore Suleiman's Ottoman Empire"
