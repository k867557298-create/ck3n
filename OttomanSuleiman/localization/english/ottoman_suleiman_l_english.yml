 ottoman_suleiman_legacy_modifier_desc: "The ruler draws authority from the institutions and reputation of Suleiman I."
 ottoman_suleiman.0001.t: "The Age of the Lawgiver"
 ottoman_suleiman.0001.desc: "Suleiman I rules from Constantinople over an empire spanning three continents. Its armies, laws, and court now await your command."
 ottoman_suleiman.0001.a: "The empire shall endure."
