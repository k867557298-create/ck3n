 ottoman_suleiman.0001.t: "Век Законодателя"
 ottoman_suleiman.0001.desc: "Сулейман I правит из Константинополя империей трёх континентов."
 ottoman_suleiman.0001.a: "Империя должна выстоять."
 ottoman_suleiman.0100.t: "Наследие Барбароссы"
 ottoman_suleiman.0100.desc: "Хайр ад-Дин Барбаросса умер. Флоту нужны люди, деньги и ясная цель."
 ottoman_suleiman.0100.a: "Финансировать флот в память о Барбароссе."
 ottoman_suleiman.0100.b: "У казны есть более срочные нужды."
 ottoman_suleiman.0200.t: "Кризис принца Мустафы"
 ottoman_suleiman.0200.desc: "Войско хвалит Мустафу, а Хюррем-султан и Рустем-паша предупреждают об угрозе престолонаследию."
 ottoman_suleiman.0200.a: "Отстранить Мустафу от наследования."
 ottoman_suleiman.0200.b: "Примирить отца и сына."
