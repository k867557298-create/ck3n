 ottoman_suleiman.0100.t: "The Legacy of Barbarossa"
 ottoman_suleiman.0100.desc: "Hayreddin Barbarossa is dead. The fleet that mastered the Mediterranean needs men, money, and a clear purpose. Grand Vizier Rustem Pasha urges a lasting investment in the imperial navy."
 ottoman_suleiman.0100.a: "Fund the fleet in Barbarossa's memory."
 ottoman_suleiman.0100.b: "The treasury has more urgent needs."
 ottoman_suleiman.0200.t: "The Prince Mustafa Crisis"
 ottoman_suleiman.0200.desc: "Reports from the army praise Prince Mustafa, while Hurrem Sultan and Rustem Pasha warn that his following threatens the order of succession. History remembers a terrible decision; the choice is now yours."
 ottoman_suleiman.0200.a: "Remove Mustafa from the succession."
 ottoman_suleiman.0200.b: "Reconcile father and son."
