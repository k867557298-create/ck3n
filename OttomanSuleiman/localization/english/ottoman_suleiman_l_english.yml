 ottoman_divan_reform_modifier: "Reformed Imperial Navy"
 ottoman_divan_reform_modifier_desc: "The Porte has invested in the fleet and its administration."
 ottoman_mustafa_crisis_modifier: "The Mustafa Crisis"
 ottoman_mustafa_crisis_modifier_desc: "The handling of Prince Mustafa has shaken confidence in the dynasty."
 ottoman_suleiman.0100.t: "The Legacy of Barbarossa"
 ottoman_suleiman.0100.desc: "Hayreddin Barbarossa is dead. The fleet that mastered the Mediterranean needs men, money, and a clear purpose. Grand Vizier Rustem Pasha urges a lasting investment in the imperial navy."
 ottoman_suleiman.0100.a: "Fund the fleet in Barbarossa's memory."
 ottoman_suleiman.0100.b: "The treasury has more urgent needs."
 ottoman_suleiman.0200.t: "The Prince Mustafa Crisis"
 ottoman_suleiman.0200.desc: "Reports from the army praise Prince Mustafa, while Hurrem Sultan and Rustem Pasha warn that his following threatens the order of succession. History remembers a terrible decision; the choice is now yours."
 ottoman_suleiman.0200.a: "Remove Mustafa from the succession."
 ottoman_suleiman.0200.b: "Reconcile father and son."
 maa_ottoman_janissaries: "Janissaries"
 maa_ottoman_janissaries_flavor: "The salaried household infantry of the Ottoman sultan, drilled for disciplined volleys and close combat."
 maa_ottoman_sipahis: "Sipahis"
 maa_ottoman_sipahis_flavor: "Armoured provincial cavalry whose land revenues support swift campaigns across the empire."
 maa_french_gendarmes: "French Gendarmes"
 maa_french_gendarmes_flavor: "Elite French men-at-arms, devastating when their lances can charge on open ground."
 maa_german_landsknechts: "Landsknechts"
 maa_german_landsknechts_flavor: "German professional pike formations, famed throughout Europe for their discipline and colourful dress."
 maa_english_longbowmen: "English Longbowmen"
 maa_english_longbowmen_flavor: "Archers trained from youth to bring dense volleys against enemies in woodland and hills."
 maa_castilian_tercios: "Castilian Tercios"
 maa_castilian_tercios_flavor: "Tough mixed infantry formations that thrive in Spain's dry country and hold firm in close combat."
 maa_russian_streltsy: "Streltsy"
 maa_russian_streltsy_flavor: "Muscovite service infantry organised around firearms, accustomed to the harsh northern frontier."
 maa_polish_winged_hussars: "Winged Hussars"
 maa_polish_winged_hussars_flavor: "Polish heavy cavalry whose shock charge is at its strongest on the open plain."
 maa_italian_condottieri: "Italian Condottieri"
 maa_italian_condottieri_flavor: "Professional Italian pike companies hired for the hard, contested wars of the peninsula."
 maa_arabian_mamluks: "Mamluk Cavalry"
 maa_arabian_mamluks_flavor: "Highly trained armoured cavalry adapted to the deserts and drylands of the Arabic-speaking world."
