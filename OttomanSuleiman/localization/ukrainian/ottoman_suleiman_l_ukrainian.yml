l_ukrainian:
 dynn_osmanli: "Османли"
 e_ottoman_empire: "Османська імперія"
 e_ottoman_empire_adj: "османськ"
 SULTAN: "Султан"
 SULTANA: "Султана"
 SULTAN_FOA: "Ваша імператорська величносте"
 bookmark_suleiman_1546: "Сулейман Пишний"
 bookmark_suleiman_1546_desc: "1546 рік. Османська імперія досягла вершини за правління Сулеймана I. Правте з Константинополя, зміцнюйте кордони й визначте спадщину Законодавця."
 restore_suleimans_empire_decision: "Відновити Османську імперію Сулеймана"
 restore_suleimans_empire_decision_desc: "Об’єднайте Анатолію та Фракію під новим османським імператорським престолом."
 restore_suleimans_empire_decision_tooltip: "Ви заснуєте Османську імперію та здобудете престиж."
 ottoman_suleiman_legacy_modifier: "Імперська спадщина Сулеймана"
 ottoman_suleiman_legacy_modifier_desc: "Правитель спирається на інституції та славу Сулеймана I."
 ottoman_suleiman.0001.t: "Доба Законодавця"
 ottoman_suleiman.0001.desc: "Сулейман I править із Константинополя імперією на трьох континентах. Її війська, закони та двір чекають на ваш наказ."
 ottoman_suleiman.0001.a: "Імперія житиме."
 dynn_habsburg_1546: "Габсбурги"
 dynn_valois_1546: "Валуа"
 dynn_tudor_1546: "Тюдори"
 dynn_rurik_1546: "Рюриковичі"
 dynn_rustem_pasha_1546: "Рустем-паша"
 ottoman_divan_reform_modifier: "Реформований імперський флот"
 ottoman_divan_reform_modifier_desc: "Порта інвестувала у флот і його управління."
 ottoman_mustafa_crisis_modifier: "Криза принца Мустафи"
 ottoman_mustafa_crisis_modifier_desc: "Рішення щодо принца Мустафи похитнуло довіру до династії."
 ottoman_suleiman.0100.t: "Спадщина Барбаросси"
 ottoman_suleiman.0100.desc: "Хайр ад-Дін Барбаросса помер. Флот, що панував у Середземному морі, потребує людей, грошей і чіткої мети. Великий візир Рустем-паша закликає надовго вкластися в імперський флот."
 ottoman_suleiman.0100.a: "Фінансувати флот на згадку про Барбароссу."
 ottoman_suleiman.0100.b: "Скарбниця має нагальніші потреби."
 ottoman_suleiman.0200.t: "Криза принца Мустафи"
 ottoman_suleiman.0200.desc: "Військо вихваляє принца Мустафу, тоді як Хюррем-султан і Рустем-паша попереджають, що його прихильники загрожують порядку спадкування. Історія пам’ятає страшне рішення; тепер вибір за вами."
 ottoman_suleiman.0200.a: "Усунути Мустафу від спадкування."
 ottoman_suleiman.0200.b: "Примирити батька і сина."
